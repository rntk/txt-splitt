[project]
name = "txt_splitt"
version = "0.1.0"
description = "A python package to split text"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txt_splitt"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = [
    "tests",
]
